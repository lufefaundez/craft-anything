name: DocxDocx
options:
  bundleIdPrefix: app.ofiofi
  deploymentTarget:
    iOS: "17.0"
    visionOS: "2.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  OfficeCoreKit:
    path: Packages/OfficeCoreKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
    OTHER_LDFLAGS: "-ObjC"

targets:
  OfficeWord-iOS:
    type: application
    platform: iOS
    sources:
      - path: OfficeWord-iOS/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ofiofi.docxdocx
        PRODUCT_NAME: DocxDocx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DocxDocx
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_LANGUAGE: es-419
    dependencies:
      - package: OfficeCoreKit
      - sdk: PencilKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UIKit.framework

  OfficeWord-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfficeWord-iOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ofiofi.docxdocx.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DocxDocx.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DocxDocx"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: OfficeWord-iOS
      - package: OfficeCoreKit

  OfficeWord-visionOS:
    type: application
    platform: visionOS
    sources:
      - path: OfficeWord-visionOS/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ofiofi.docxdocx.vision
        PRODUCT_NAME: DocxDocx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DocxDocx
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SUPPORTED_PLATFORMS: "xrsimulator xros"
        TARGETED_DEVICE_FAMILY: "7"
        DEVELOPMENT_LANGUAGE: es-419
    dependencies:
      - package: OfficeCoreKit
      - sdk: UniformTypeIdentifiers.framework

schemes:
  OfficeWord-iOS:
    build:
      targets:
        OfficeWord-iOS: all
        OfficeWord-iOSTests: [test]
    test:
      targets:
        - name: OfficeWord-iOSTests
  OfficeWord-visionOS:
    build:
      targets:
        OfficeWord-visionOS: all
